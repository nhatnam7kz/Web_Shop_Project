<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chi tiết sản phẩm | King Shop</title>
    <meta name="description" content="Xem mô tả, hình ảnh, giá bán, kích thước và màu sắc sản phẩm tại King Shop.">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/product.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/search-animation.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <main class="product-page">
      <div class="container">
        <nav
          class="breadcrumb"
          id="product-breadcrumb"
          aria-label="Đường dẫn"
        ></nav>
        <div id="product-detail"></div>
        <section class="related-section">
          <h2>Sản phẩm liên quan</h2>
          <div id="related-products" class="product-grid catalog-grid"></div>
        </section>
      </div>
    </main>

    <div id="site-footer"></div>
    <div id="toast-container"></div>
    <div id="quick-view" class="quick-view" hidden></div>

    <script src="../js/config.js"></script>
    <script src="../js/validate.js"></script>
    <script src="../js/products.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/wishlist.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
