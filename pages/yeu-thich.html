<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sản phẩm yêu thích | Tên shop</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/product.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/account.css" />
  </head>
  <body data-page="wishlist">
    <div id="site-header"></div>
    <main>
      <div class="page-container">
        <div class="wishlist-header">
          <h1 class="page-header__title">Sản phẩm yêu thích</h1>
          <span class="wishlist-header__count" id="wishlist-count"></span>
        </div>
        <div class="wishlist-empty" id="wishlist-empty" hidden>
          <p class="wishlist-empty__title">Bạn chưa lưu sản phẩm nào</p>
          <p>Bấm biểu tượng trái tim trên sản phẩm để lưu lại và xem sau.</p>
          <a class="btn btn--primary" href="san-pham.html">Xem sản phẩm</a>
        </div>
        <div id="product-list" class="product-grid"></div>
      </div>
    </main>
    <div id="site-footer"></div>
    <div id="toast-container"></div>
    <!-- Thứ tự script: KHÔNG ĐỔI -->
    <script src="../js/config.js"></script>
    <script src="../js/validate.js"></script>
    <script src="../js/products.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/wishlist.js"></script>
    <script src="../js/auth.js"></script>
